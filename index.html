<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zona 8 · Cuentas</title>

<style>
:root{--bg:#f4f5f2;--sf:#fff;--tx:#2a1f1d;--mu:#6e605c;--ac:#650f0f;--onac:#fff;--hero:#650f0f;--ac2:#f0e3df;--in:#2e7d1f;--eg:#b4281f;--wa:#8a5a12;--bd:#e0dbd6;--lime:#b6e8a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17110f;--sf:#221a18;--tx:#f1e8e5;--mu:#b7a7a2;--ac:#e39a8c;--onac:#2a0f0c;--hero:#7a1c1c;--ac2:#3a2622;--in:#7fd35f;--eg:#ff8a80;--wa:#f0b45a;--bd:#3a2e2b}}
:root[data-theme=dark]{--bg:#17110f;--sf:#221a18;--tx:#f1e8e5;--mu:#b7a7a2;--ac:#e39a8c;--onac:#2a0f0c;--hero:#7a1c1c;--ac2:#3a2622;--in:#7fd35f;--eg:#ff8a80;--wa:#f0b45a;--bd:#3a2e2b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;font-weight:800;margin:4px 0 12px}h2{font-size:17px;font-weight:800;margin:20px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mu);font:600 11px Nunito,sans-serif;padding:12px 1px;cursor:pointer}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
.hero{background:var(--hero);color:#fff;border-radius:20px;padding:20px}
.hero small{opacity:.85;font-weight:600}.hero b{display:block;font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 10px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.hero .r{display:flex;justify-content:space-between;margin-top:8px;font-weight:600;font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mu{color:var(--mu);font-size:13px}.in{color:var(--in);font-weight:800}.eg{color:var(--eg);font-weight:800}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 10px}
label{font-weight:600;font-size:14px}
button.p{background:var(--ac);color:var(--onac);border:0;border-radius:12px;padding:12px 18px;font:800 16px Nunito,sans-serif;cursor:pointer;width:100%}
button.s{background:var(--ac2);color:var(--ac);border:0;border-radius:10px;padding:8px 12px;font:700 14px Nunito,sans-serif;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.chips button{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 13px;font:600 14px Nunito,sans-serif;cursor:pointer}.chips button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--ac2);color:var(--ac);margin:3px 4px 0 0}.tag.w{background:#f7e3c8;color:var(--wa)}.tag.m{background:#f9d9d5;color:var(--eg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--bd)}
.hide{display:none}.empty{text-align:center;color:var(--mu);padding:24px 8px}
dialog{border:0;border-radius:18px;padding:18px;width:min(520px,94vw);background:var(--sf);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.45)}
.tb{overflow-x:auto}
.brand{background:#fff;border-radius:16px;border-bottom:4px solid #3a9a24;padding:10px 14px;margin:2px 0 14px;display:flex;justify-content:center}
.brand img{height:62px;width:auto;max-width:100%}.brand.big img{height:150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.day{position:relative;aspect-ratio:1;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font:600 15px Nunito,sans-serif;cursor:pointer}.day.td{border:2px solid var(--ac);color:var(--ac)}
.day i{position:absolute;right:4px;bottom:3px;font-style:normal;font-size:11px;background:var(--ac);color:var(--onac);border-radius:9px;padding:0 6px}
.pt{width:100%;border-collapse:collapse}.pt th{text-align:left;font-size:13px;color:var(--mu);padding:4px}.pt td{padding:3px}.pt input{margin:0}.pt input[type=checkbox]{width:22px;height:22px}
.pt tr.dn input[type=text]{text-decoration:line-through;color:var(--mu)}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.ck input{width:22px;height:22px;margin:0;flex:none}.ck span{flex:1}.ck.dn span{text-decoration:line-through;color:var(--mu)}
button.tag{border:0;cursor:pointer;font-family:inherit}

const BRAND=`<div class="brand"><img src="${LOGO}" alt="Asociación de Residentes Zona 8"></div>`;
document.getElementById('fav').href=LOGO;
const MES=['Agosto','Septiembre','Octubre','Noviembre','Diciembre','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio'];
const MKEY=MES.map((_,i)=>{const m=(7+i)%12+1,y=i<5?2026:2027;return y+'-'+String(m).padStart(2,'0')});
const CI=['Remanente / BeResident','Mantenimiento fuera de app','Deuda Enrique','Otro ingreso'];
const CE=['Seguridad Z8','Seguridad Arco Principal','Mantenimiento Z8','Mantenimiento Arco','Totalplay','CFE Caseta','CFE Luminaria','Reparaciones','Tags pagados sin entregar','Otro egreso'];

const fix=(k,a)=>k=='ledger'?a.map(x=>(x.c=='Tags'||x.c=='Tags (previamente pagados sin entregar)')?{...x,c:'Tags pagados sin entregar',t:'e'}:CMAP[x.c]?{...x,c:CMAP[x.c]}:x):a;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=d=>{const[a,b,c]=d.split('-');return +c+' '+MES[(+b+4)%12].slice(0,3)};
let S={led:[],homes:[],ev:[],td:[],cm:'',cf:'',st:[],fl:[],fcat:'',tab:'mov',mes:null,admin:true,db:null,assets:null,ready:false,hf:''};
const cur=()=>{const k=new Date().toISOString().slice(0,7);return MKEY.includes(k)?k:MKEY[3]};
S.mes=cur();
const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ymd=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const todayS=()=>{const n=new Date();return ymd(n.getFullYear(),n.getMonth(),n.getDate())};
S.cm=todayS().slice(0,7);
function save(name,doc,arr){S[name]=arr;render();sb.from('docs').upsert({key:doc.split('/')[1],items:arr,updated_at:new Date().toISOString()}).then(({error})=>{if(error)alert('No se pudo guardar: '+error.message)})}
S.assets={async upload(f,folder){const path=(folder||'archivos')+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');const{error}=await sb.storage.from('files').upload(path,f,{contentType:f.type||undefined});if(error)throw error;return{id:path}},async delete(p){await sb.storage.from('files').remove([p])}};
const U={};
async function hydrate(){
  const need=[...new Set($$('[data-sp]').map(e=>e.dataset.sp).filter(p=>!U[p]||U[p].t<Date.now()))];
  if(need.length){const{data}=await sb.storage.from('files').createSignedUrls(need,3600);(data||[]).forEach(r=>{if(r.signedUrl)U[r.path]={u:r.signedUrl,t:Date.now()+3000000}})}
  $$('[data-sp]').forEach(e=>{const x=U[e.dataset.sp];if(x){if(e.tagName=='A')e.href=x.u;else e.src=x.u}})}
const saveLed=a=>save('led','app/ledger',a),saveHomes=a=>save('homes','priv/homes',a),saveSt=a=>save('st','app/statements',a),saveFl=a=>save('fl','app/files',a),saveEv=a=>save('ev','app/agenda',a),saveTd=a=>save('td','app/todos',a);
function tot(k){const L=S.led.filter(x=>(!k||x.d.startsWith(k))&&!EXC.includes(x.c));const i=L.filter(x=>x.t=='i').reduce((s,x)=>s+x.a,0),e=L.filter(x=>x.t=='e').reduce((s,x)=>s+x.a,0);return{i,e,b:i-e}}
function render(){
  const tabs=[['mov','Agregar'],['bal','Balance'],['deu','Adeudos'],['age','Agenda'],['dom','Domicilios'],['fil','Documentos']];
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
  $('#app').innerHTML=BRAND+{bal:vBal,age:vAge,deu:vDeu,mov:vMov,dom:vDom,fil:vFil}[S.tab]()+'<div style="text-align:center;margin-top:34px"><button class="s" id="lo">Cerrar sesión</button></div>';
  $('#lo').onclick=()=>sb.auth.signOut().then(()=>location.reload());
  bind();hydrate();
}
function vBal(){
  const A=tot(),M=tot(S.mes),pct=A.i?Math.max(0,Math.min(100,A.b/A.i*100)):0;

  const by={};L.forEach(x=>{const k=x.t+x.c;by[k]=by[k]||{t:x.t,c:x.c,a:0};by[k].a+=x.a});
  return `<h1>Balance</h1>
  <div class="hero"><small>Saldo disponible del año (ago–jul)</small><b>${money(A.b)}</b><div class="bar"><i style="width:${pct}%"></i></div>

  <h2>Mes</h2><div class="chips">${MES.map((m,i)=>`<button class="${MKEY[i]==S.mes?'on':''}" data-m="${MKEY[i]}">${m}</button>`).join('')}</div>

  <div class="card"><div class="row"><b>Balance del mes</b><b class="${M.b<0?'eg':'in'}">${money(M.b)}</b></div></div>

  $$('[data-m]').forEach(b=>b.onclick=()=>{S.mes=b.dataset.m;render()});
  $$('[data-pdf]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await pdfMes(b.dataset.pdf)}catch(e){alert('No se pudo crear el PDF: '+(e.message||e))}b.disabled=false});
  $$('[data-fc]').forEach(b=>b.onclick=()=>{S.fcat=b.dataset.fc;render()});
  $$('[data-fd]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este archivo?'))return;const f=S.fl.find(x=>x.id==b.dataset.fd);saveFl(S.fl.filter(x=>x.id!=f.id));try{await S.assets.delete(f.a)}catch(e){}});
  $$('[data-dl]').forEach(b=>b.onclick=async()=>{const f=S.fl.find(x=>x.id==b.dataset.dl);b.disabled=true;const{data,error}=await sb.storage.from('files').createSignedUrl(f.a,120,{download:f.f||f.t});b.disabled=false;if(error||!data)alert('No se pudo descargar el archivo.');else location.href=data.signedUrl});
  if($('#fu'))$('#fu').onclick=async()=>{const f=$('#ff').files[0],m=$('#fm');if(!f)return m.textContent='Elige un archivo.';$('#fu').disabled=true;m.textContent='Subiendo…';try{const r=await S.assets.upload(f,'documentos'),z=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB';saveFl([...S.fl,{id:'f'+Date.now(),c:CF.includes(S.fcat)?S.fcat:CF[0],t:$('#ft').value.trim()||f.name,f:f.name,a:r.id,d:$('#fdt').value||todayS(),z}])}catch(e){$('#fu').disabled=false;m.textContent='No se pudo subir: '+(e.message||'error')}};
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este movimiento?'))saveLed(S.led.filter(x=>x.id!=b.dataset.del))});
  $$('[data-h]').forEach(b=>b.onclick=()=>editHome(b.dataset.h));
  $$('[data-mt]').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=cur();saveHomes(S.homes.map(x=>x.id==b.dataset.mt?{...x,mor:{...(x.mor||{}),[k]:!(x.mor&&x.mor[k])}}:x))});
  $$('[data-sd]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Quitar este archivo?'))return;const f=S.st.find(x=>x.id==b.dataset.sd);saveSt(S.st.filter(x=>x.id!=f.id));try{if(S.assets)await S.assets.delete(f.a)}catch(e){}});
  if($('#su'))$('#su').onclick=async()=>{const f=$('#sf').files[0],m=$('#sm');if(!f)return m.textContent='Elige un archivo.';if(!S.assets)return m.textContent='No se pueden subir archivos en esta vista.';$('#su').disabled=true;m.textContent='Subiendo…';try{const r=await S.assets.upload(f,'estados');saveSt([...S.st,{id:'s'+Date.now(),m:S.mes,a:r.id,n:f.name}])}catch(e){$('#su').disabled=false;m.textContent='No se pudo subir: '+(e.message||e.code)}};
  $$('[data-st]').forEach(b=>b.onclick=()=>{S.cf=b.dataset.st;render()});
  $$('[data-as]').forEach(b=>b.onclick=e=>{e.stopPropagation();editHome('new',b.dataset.as)});
  $$('[data-r]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[h,r]=b.dataset.r.split('|');editRes(h,r)});
  $$('[data-ar]').forEach(b=>b.onclick=e=>{e.stopPropagation();editRes(b.dataset.ar,'new')});
  $$('[data-day]').forEach(b=>b.onclick=()=>dayDlg(b.dataset.day));
  $$('[data-cm]').forEach(b=>b.onclick=()=>{let[y,m]=S.cm.split('-').map(Number);m+=+b.dataset.cm-1;S.cm=ymd(new Date(y,m,1).getFullYear(),new Date(y,m,1).getMonth(),1).slice(0,7);render()});
  const up=(id,p)=>saveTd(S.td.map(x=>x.id==id?{...x,...p}:x));
  $$('[data-tc]').forEach(c=>c.onchange=()=>up(c.dataset.tc,{done:c.checked}));
  $$('[data-tt]').forEach(c=>c.onchange=()=>up(c.dataset.tt,{t:c.value.trim()}));
  $$('[data-tdd]').forEach(c=>c.onchange=()=>up(c.dataset.tdd,{due:c.value}));
  $$('[data-tx]').forEach(c=>c.onclick=()=>saveTd(S.td.filter(x=>x.id!=c.dataset.tx)));
  if($('#ta'))$('#ta').onclick=()=>{const t=$('#tn').value.trim();if(t)saveTd([...S.td,{id:'t'+Date.now(),t,done:false}])};
  if($('#tn'))$('#tn').onkeydown=e=>{if(e.key=='Enter')$('#ta').click()};
  if($('#hn'))$('#hn').onclick=()=>editHome('new');
  if($('#hq'))$('#hq').oninput=e=>{S.hf=e.target.value;const p=e.target.selectionStart;render();const q=$('#hq');q.focus();q.setSelectionRange(p,p)};
  if($('#mt'))$('#mt').onchange=e=>{S.mt=e.target.value;render()};
  if($('#ms'))$('#ms').onclick=async()=>{
    const a=+$('#ma').value,m=$('#mm');if(!a||a<=0)return m.textContent='Escribe el monto.';
    const f=$('#mf').files[0];let img='';$('#ms').disabled=true;
    try{if(f){if(!S.assets)throw new Error('No se puede subir imágenes en esta vista');m.textContent='Subiendo comprobante…';img=(await S.assets.upload(f,'comprobantes')).id}}
    catch(e){$('#ms').disabled=false;return m.textContent='No se subió el comprobante: '+(e.message||e.code)}
    const t=$('#mt').value;
    saveLed([...S.led,{id:'x'+Date.now(),d:$('#md').value,c:$('#mc').value,t,a,n:$('#mn').value.trim()||$('#mc').value,h:$('#mh')?$('#mh').value:'',img}]);
    S.tab='bal';S.mes=$('#md')?S.led[S.led.length-1].d.slice(0,7):S.mes;render()};
}
function loginView(){
  $('#nav').innerHTML='';
  $('#app').innerHTML=`<div class="brand big"><img src="${LOGO}" alt="Asociación de Residentes Zona 8"></div><p class="mu" style="text-align:center;margin:0 0 6px">Acceso para el comité</p><div class="card"><label>Usuario (tu correo)</label><input id="le" type="email" autocomplete="username"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"><button class="p" id="li">Entrar</button><div id="lm" class="mu" style="margin-top:8px"></div></div>`;
  const go=async()=>{$('#lm').textContent='Entrando…';const{error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)$('#lm').textContent='No se pudo entrar: revisa tu correo y contraseña.';else location.reload()};
  $('#li').onclick=go;$('#lp').onkeydown=e=>{if(e.key=='Enter')go()}}
const APPLY={ledger:'led',homes:'homes',agenda:'ev',todos:'td',statements:'st',files:'fl'};
async function load(){
  const{data,error}=await sb.from('docs').select('key,items');
  if(error){$('#app').innerHTML='<div class="empty">No se pudieron cargar los datos: '+esc(error.message)+'</div>';return}
  (data||[]).forEach(r=>{if(APPLY[r.key])S[APPLY[r.key]]=fix(r.key,r.items||[])});render()}
const busy=()=>document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
(async()=>{
  if(SUPABASE_URL.startsWith('PEGA')){$('#app').innerHTML='<div class="empty">Falta pegar la URL y la llave de Supabase al inicio del código (archivo index.html).</div>';return}
  const{data}=await sb.auth.getSession();
  if(!data.session)return loginView();
  await load();
  sb.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=p.new;if(r&&APPLY[r.key]){S[APPLY[r.key]]=fix(r.key,r.items||[]);if(!busy())render()}}).subscribe();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy())load()});
})();
</script></body></html>
